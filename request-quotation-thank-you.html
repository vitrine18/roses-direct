<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quotation Received | Farm Direct Roses</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(135deg, #f8f3f1, #fff);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      color: #333;
    }

    .thank-you-box {
      max-width: 560px;
      background: white;
      padding: 48px;
      border-radius: 18px;
      box-shadow: 0 30px 60px rgba(0,0,0,0.1);
      text-align: center;
    }

    h1 {
      color: #c0392b;
      margin-bottom: 12px;
    }

    p {
      line-height: 1.7;
      margin: 14px 0;
      font-size: 16px;
    }

    .go-box {
      margin-top: 28px;
      padding: 18px;
      background: #f3f3f3;
      border-radius: 12px;
      font-weight: 500;
    }

    .go {
      display: inline-block;
      margin-top: 10px;
      background: #2ecc71;
      color: white;
      padding: 10px 18px;
      border-radius: 30px;
      font-weight: 700;
      letter-spacing: 1px;
    }

    .soft {
      font-size: 14px;
      color: #777;
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="thank-you-box">
    <h1>Thank you 🌹</h1>

    <p>
      Your quotation request has been received successfully.
      Our team is now confirming availability and preparing your final quote.
    </p>

    <div class="go-box">
        Once you receive your quotation,<br>
        simply reply to our email by writing:
        <div class="go-text">GO</div>
    </div>


    <p class="soft">
      Advance payment is required to secure production
      and DHL Express shipping.
    </p>
  </div>
</body>
</html>
